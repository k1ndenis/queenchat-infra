# QueenChat TURN server. The REST shared secret is intentionally supplied at
# runtime via TURN_SHARED_SECRET, not stored in this file.
listening-port=3478
realm=queenchat.ru
fingerprint
use-auth-secret
# Bind TURN only to the VPS public IPv4. Do not auto-discover Docker bridges
# or loopback interfaces for listener/relay sockets.
listening-ip=192.124.189.26
relay-ip=192.124.189.26
external-ip=192.124.189.26
min-port=49160
max-port=49220

# Do not provide unauthenticated relay service or local admin interfaces.
no-cli
no-multicast-peers
stale-nonce

# A single authenticated account cannot consume all relay allocations. Values
# leave adequate room for concurrent browser/mobile calls and are configurable
# by replacing this file during a planned capacity review.
user-quota=8
total-quota=200

# TLS/DTLS is deliberately disabled until turn.queenchat.ru has a DNS record
# and a certificate can be supplied to this container safely. TURN over UDP/TCP
# on 3478 remains fully functional in the meantime.
no-tls
no-dtls
