services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data_queenchat:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - queenchat_network
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data_queenchat:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - queenchat_network
    logging: *default-logging

  api:
    build:
      context: ./api
    image: queenchat-api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FIREBASE_SERVICE_ACCOUNT: /app/firebase-service-account.json
      SMS_API_ID: ${SMS_API_ID}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UPLOAD_MIN_FREE_DISK_PERCENT: ${UPLOAD_MIN_FREE_DISK_PERCENT:-10}
      DAILY_UPLOAD_BYTES_PER_USER: ${DAILY_UPLOAD_BYTES_PER_USER:-524288000}
      DAILY_UPLOAD_FILES_PER_USER: ${DAILY_UPLOAD_FILES_PER_USER:-100}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in .env before deploying coturn}
      TURN_HOST: ${TURN_HOST:-turn.queenchat.ru}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-3600}
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-}
    volumes:
      - ./api/firebase-service-account.json:/app/firebase-service-account.json
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - queenchat_network
    logging: *default-logging

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    image: queenchat-client
    depends_on:
      - api
    networks:
      - queenchat_network
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    container_name: queenchat-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./releases:/srv/releases:ro
      - caddy_data:/data
    networks:
      - queenchat_network
    depends_on:
      - api
      - client
    logging: *default-logging

  coturn:
    image: coturn/coturn:4.7.0
    restart: unless-stopped
    # Host networking avoids Docker's per-port UDP proxy and lets coturn bind
    # its configured relay range directly on the VPS public interface.
    network_mode: host
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in .env before deploying coturn}
    command:
      - /bin/sh
      - -ec
      - exec turnserver -c /etc/coturn/turnserver.conf --static-auth-secret="$$TURN_SHARED_SECRET"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pidof turnserver >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=1500MB
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [queenchat_network]
    mem_limit: 180m
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    environment:
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:?Set ALERT_TELEGRAM_BOT_TOKEN in .env}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:?Set ALERT_TELEGRAM_CHAT_ID in .env}
    # Render Telegram credentials only inside the container. Docker Compose
    # never expands them into the checked-in Alertmanager configuration.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        sed "s|__ALERT_TELEGRAM_BOT_TOKEN__|$${ALERT_TELEGRAM_BOT_TOKEN}|g; s|__ALERT_TELEGRAM_CHAT_ID__|$${ALERT_TELEGRAM_CHAT_ID}|g" /etc/alertmanager-template/alertmanager.yml > /tmp/alertmanager.yml;
        amtool check-config /tmp/alertmanager.yml;
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager-template/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [queenchat_network]
    mem_limit: 60m
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/queenchat-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [queenchat_network]
    mem_limit: 180m
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: ["--path.rootfs=/host", "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"]
    volumes: ["/:/host:ro,rslave"]
    networks: [queenchat_network]
    mem_limit: 80m
    logging: *default-logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    networks: [queenchat_network]
    mem_limit: 50m
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.72.0
    restart: unless-stopped
    command: ["--redis.addr=redis://redis:6379"]
    networks: [queenchat_network]
    mem_limit: 40m
    logging: *default-logging

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    restart: unless-stopped
    networks: [queenchat_network]
    mem_limit: 50m
    logging: *default-logging

volumes:
  pg_data_queenchat:
  redis_data_queenchat:
  caddy_data:
  uploads_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  queenchat_network:
    driver: bridge
