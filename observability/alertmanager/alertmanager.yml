global:
  resolve_timeout: 5m
route:
  receiver: telegram
  group_by: [alertname, job, severity]
  group_wait: 45s
  group_interval: 10m
  repeat_interval: 6h
receivers:
  - name: telegram
    telegram_configs:
      - bot_token: __ALERT_TELEGRAM_BOT_TOKEN__
        chat_id: __ALERT_TELEGRAM_CHAT_ID__
        parse_mode: HTML
        send_resolved: true
        message: '{{ if eq .Status "resolved" }}✅ QueenChat recovered{{ else }}🚨 QueenChat: {{ .CommonAnnotations.summary }}{{ end }}\nSeverity: {{ .CommonLabels.severity }}\n{{ .CommonAnnotations.description }}'
