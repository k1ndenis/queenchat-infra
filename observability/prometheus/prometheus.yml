global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: production
    service: queenchat
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: queenchat-api
    metrics_path: /metrics
    static_configs: [{targets: [api:3002]}]
  - job_name: node
    static_configs: [{targets: [node-exporter:9100]}]
  - job_name: postgres
    static_configs: [{targets: [postgres-exporter:9187]}]
  - job_name: redis
    static_configs: [{targets: [redis-exporter:9121]}]
  - job_name: blackbox-https
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: [https://queenchat.ru]
        labels: {target: queenchat.ru}
      - targets: [https://monitor.queenchat.ru]
        labels: {target: monitor.queenchat.ru}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
